<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Teranga AI, in progress: A customizable AI-agent platform for professionals, businesses and individuals."><title>Teranga AI, in progress: A customizable AI-agent platform for professionals, businesses and individuals.</title><style>@font-face{font-family:'Bricolage Grotesque';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:'Bricolage Grotesque','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace}
.in{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
