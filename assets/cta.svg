<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Let's build something together. Open to full-time roles and freelance missions."><title>Let's build something together. Open to full-time roles and freelance missions.</title><style>@font-face{font-family:'Bricolage Grotesque';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:'Bricolage Grotesque','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace}
.in{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
