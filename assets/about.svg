<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About me: I configure switches, firewalls, VPNs and Linux servers, then I build the web apps that run on top of them. I founded Teranga Académie, an online school in French for francophone Africa, and I train people in digital skills. Right now: Building Teranga AI, an AI-agent platform. Exploring AI agents and LLM integration. 3rd year at UNCHK, UCAO graduate. Working in French and English."><title>About me: I configure switches, firewalls, VPNs and Linux servers, then I build the web apps that run on top of them. I founded Teranga Académie, an online school in French for francophone Africa, and I train people in digital skills. Right now: Building Teranga AI, an AI-agent platform. Exploring AI agents and LLM integration. 3rd year at UNCHK, UCAO graduate. Working in French and English.</title><style>@font-face{font-family:'Bricolage Grotesque';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:'Bricolage Grotesque','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace}
.in{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
